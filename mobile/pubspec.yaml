name: school_connect
description: "Bizentrix SchoolConnect - Structured School Communication & Homework Management App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1

  # Networking & REST API
  dio: ^5.4.3+1

  # Routing
  go_router: ^14.1.4

  # Local & Secure Storage (JWT tokens, user profile cache)
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # UI & Design System
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  intl: ^0.19.0

  # Files & Attachments
  file_picker: ^8.0.3
  open_filex: ^4.5.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.1

  # Utilities
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
